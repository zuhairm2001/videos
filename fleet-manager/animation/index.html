<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fleet-manager · animation</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070b; }
      body { display: flex; align-items: center; justify-content: center; flex-direction: column; }
      #out { width: min(100vw, calc((100vh - 32px) * 16 / 9)); aspect-ratio: 16 / 9; }
      #hud { color: #8894a8; font: 13px monospace; height: 24px; line-height: 24px; }
      body.render #hud { display: none; }
      body.render #out { width: 192px; }
    </style>
  </head>
  <body>
    <canvas id="out" width="1920" height="1080"></canvas>
    <div id="hud">loading…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
